<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Weather Dashboard</title>
<script src="https://cdn.plot.ly/plotly-2.35.0.min.js"></script>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; background: #111; font-family: sans-serif; color: white; }

  /* ── Tab bar ── */
  #tabbar {
    display: flex;
    background: #1a1a1a;
    border-bottom: 1px solid #333;
  }
  .tab-btn {
    padding: 14px 22px;
    background: none;
    border: none;
    color: #aaa;
    font-size: 15px;
    cursor: pointer;
    border-bottom: 3px solid transparent;
  }
  .tab-btn:hover { color: #fff; background: #222; }
  .tab-btn.active { color: #fff; border-bottom: 3px solid #4da3ff; }

  .tab-panel { display: none; }
  .tab-panel.active { display: block; }

  /* ── Radar tab ── */
  #controls { padding: 10px; display: flex; align-items: center; gap: 12px; }
  #slider { flex: 1; }
  #timestamp { min-width: 160px; font-size: 14px; }
  #map { height: calc(100vh - 110px); }

  /* ── Image gallery tabs ── */
  .gallery {
    padding: 16px;
    max-width: 1000px;
    margin: 0 auto;
  }
  .gallery-item {
    margin-bottom: 24px;
  }
  .gallery-item img {
    width: 100%;
    display: block;
    border-radius: 6px;
    border: 1px solid #333;
  }
  .gallery-caption {
    padding: 8px 4px;
    font-size: 13px;
    color: #aaa;
  }
  .gallery-status {
    padding: 40px;
    text-align: center;
    color: #888;
  }
</style>
</head>
<body>

<div id="tabbar">
  <button class="tab-btn active" data-tab="radar">Forecast Map</button>
  <button class="tab-btn" data-tab="setA">Point Forecasts</button>
  <button class="tab-btn" data-tab="setB">Verification</button>
</div>

<!-- ── Radar Loop tab ── -->
<div id="tab-radar" class="tab-panel active">
  <div id="controls">
    <button id="playBtn">▶ Play</button>
    <input id="slider" type="range" min="0" max="3" value="0" step="1">
    <span id="timestamp">Loading...</span>
  </div>
  <div id="map"></div>
</div>

<!-- ── Image Set A tab ── -->
<div id="tab-setA" class="tab-panel">
  <div id="gallery-setA" class="gallery">
    <div class="gallery-status">Loading Images/ ...</div>
  </div>
</div>

<!-- ── Image Set B tab ── -->
<div id="tab-setB" class="tab-panel">
  <div id="gallery-setB" class="gallery">
    <div class="gallery-status">Loading Images/ ...</div>
  </div>
</div>

<script>

// ============================================================
// Tab switching
// ============================================================
const tabButtons = document.querySelectorAll('.tab-btn');
const tabPanels = {
  radar: document.getElementById('tab-radar'),
  setA: document.getElementById('tab-setA'),
  setB: document.getElementById('tab-setB'),
};

let radarInitialized = false;
let galleryLoaded = { setA: false, setB: false };

tabButtons.forEach(btn => {
  btn.addEventListener('click', () => {
    const target = btn.dataset.tab;

    tabButtons.forEach(b => b.classList.toggle('active', b === btn));
    Object.entries(tabPanels).forEach(([key, panel]) => {
      panel.classList.toggle('active', key === target);
    });

    // Lazy-init each tab's content the first time it's shown
    if (target === 'radar' && !radarInitialized) {
      radarInitialized = true;
      initFigure().catch(err => {
        console.error('Top-level initFigure error:', err);
        document.getElementById('timestamp').innerText = 'Error: ' + err.message;
      });
    }
    if ((target === 'setA' || target === 'setB') && !galleryLoaded[target]) {
      galleryLoaded[target] = true;
      const folder = target === 'setA' ? 'imagesA' : 'imagesB';
      loadGallery(folder, `gallery-${target}`);
    }

    // Plotly needs a resize nudge if it was hidden when drawn
    if (target === 'radar' && radarInitialized) {
      window.dispatchEvent(new Event('resize'));
    }
  });
});

// ============================================================
// Image gallery: auto-scan a folder for sequentially numbered PNGs
// Tries 001.png, 002.png, ... and stops after several consecutive misses.
// Adjust `pad`, `ext`, or `startAt` below if your filenames differ.
// ============================================================
async function loadGallery(folder, containerId) {
  const container = document.getElementById(containerId);
  const pad = 3;          // filename padding, e.g. 001.png
  const ext = 'png';
  const maxConsecutiveMisses = 5;
  const hardCap = 500;     // safety stop

  const found = [];
  let misses = 0;

  for (let i = 1; i <= hardCap; i++) {
    const name = `${String(i).padStart(pad, '0')}.${ext}`;
    const url = `${folder}/${name}`;
    const ok = await imageExists(url);
    if (ok) {
      found.push(url);
      misses = 0;
    } else {
      misses++;
      if (misses >= maxConsecutiveMisses) break;
    }
  }

  container.innerHTML = '';

  if (found.length === 0) {
    container.innerHTML = `<div class="gallery-status">No images found in ${folder}/ (expected files like 001.png, 002.png, ...)</div>`;
    return;
  }

  found.forEach(url => {
    const item = document.createElement('div');
    item.className = 'gallery-item';
    const img = document.createElement('img');
    img.src = url;
    img.loading = 'lazy';
    item.appendChild(img);
    const caption = document.createElement('div');
    caption.className = 'gallery-caption';
    caption.textContent = url.split('/').pop();
    item.appendChild(caption);
    container.appendChild(item);
  });
}

function imageExists(url) {
  return new Promise(resolve => {
    const img = new Image();
    img.onload = () => resolve(true);
    img.onerror = () => resolve(false);
    img.src = url;
  });
}

// ============================================================
// Radar loop (Plotly) — unchanged logic, wrapped for lazy init
// ============================================================

const TRACE = {
  DBZ:   { start: 0, count: 8 },
  RAIN:  8,
  MIX:   9,
  SNOW:  10,
  WIND:  25,
  HOVER: 26,
};

const DBZ_COLORS = [
  'rgb(0,255,0)', 'rgb(0,200,0)', 'rgb(255,255,0)',
  'rgb(255,165,0)', 'rgb(255,0,0)', 'rgb(180,0,0)',
  'rgb(255,0,255)', 'rgb(180,0,180)'
];

let TOTAL_FRAMES = 145;
const frameCache = {};
let currentFrame = 0;
let playing = false;
let playInterval = null;
let staticData = null;
let meta = null;

async function fetchFrame(i) {
  if (frameCache[i]) return frameCache[i];
  const resp = await fetch(`data/frame_${String(i).padStart(3, '0')}.json`);
  if (!resp.ok) throw new Error(`Frame ${i} not found (HTTP ${resp.status})`);
  frameCache[i] = await resp.json();
  return frameCache[i];
}

function prefetchFrames() {
  for (let i = 1; i < TOTAL_FRAMES; i++) {
    fetchFrame(i).catch(err => console.warn(`Prefetch frame ${i}:`, err.message));
  }
}

async function loadFrame(i) {
  let f;
  try {
    f = await fetchFrame(i);
  } catch(err) {
    console.warn(`Skipping frame ${i}:`, err.message);
    return;
  }

  const traceIndices = [];
  const restyleData = { lat: [], lon: [], customdata: [] };

  for (let r = 0; r < 8; r++) {
    traceIndices.push(r);
    restyleData.lat.push(f.radar[r]?.lats ?? []);
    restyleData.lon.push(f.radar[r]?.lons ?? []);
    restyleData.customdata.push(null);
  }

  [[TRACE.RAIN, f.rain], [TRACE.MIX, f.mix], [TRACE.SNOW, f.snow]].forEach(([idx, d]) => {
    traceIndices.push(idx);
    restyleData.lat.push(d?.lats ?? []);
    restyleData.lon.push(d?.lons ?? []);
    restyleData.customdata.push(null);
  });

  traceIndices.push(TRACE.WIND);
  restyleData.lat.push(f.wind_lats ?? []);
  restyleData.lon.push(f.wind_lons ?? []);
  restyleData.customdata.push(null);

  traceIndices.push(TRACE.HOVER);
  restyleData.lat.push(f.hover?.lats ?? []);
  restyleData.lon.push(f.hover?.lons ?? []);
  restyleData.customdata.push(
    (f.hover?.t2 ?? []).map((t, idx) => [t, f.hover.spd[idx], staticData.ter[idx]])
  );

  await Plotly.restyle('map', restyleData, traceIndices);

  await Plotly.relayout('map', {
    'map.layers[1].source': `data:image/webp;base64,${f.t2_img}`,
    'map.layers[1].coordinates': [
      [f.bounds.lon_min, f.bounds.lat_max],
      [f.bounds.lon_max, f.bounds.lat_max],
      [f.bounds.lon_max, f.bounds.lat_min],
      [f.bounds.lon_min, f.bounds.lat_min],
    ],
  });

  document.getElementById('timestamp').innerText = f.timestamp;
  currentFrame = i;
  document.getElementById('slider').value = i;
}

async function initFigure() {
  try {
    const staticResp = await fetch('data/static.json');
    staticData = await staticResp.json();
  } catch(e) {
    console.error('static.json failed:', e);
    document.getElementById('timestamp').innerText = 'Error loading static.json';
    return;
  }

  try {
    const metaResp = await fetch('data/meta.json');
    meta = await metaResp.json();
    TOTAL_FRAMES = meta.total_frames;
    document.getElementById('slider').max = TOTAL_FRAMES - 1;
  } catch(e) {
    console.error('meta.json failed:', e);
    document.getElementById('timestamp').innerText = 'Error loading meta.json';
    return;
  }

  const traces = [];

  const levels = [10, 20, 30, 40, 50, 60, 70, 80];
  levels.forEach((lvl, i) => {
    traces.push({
      type: 'scattermap', mode: 'lines',
      lat: [], lon: [],
      line: { color: DBZ_COLORS[i], width: 2 },
      name: `${lvl} dBZ`,
      hoverinfo: 'skip',
      showlegend: true,
    });
  });

  traces.push({ type: 'scattermap', mode: 'markers', lat: [], lon: [], marker: { size: 4, color: 'chartreuse' }, name: 'Rain', showlegend: true, hoverinfo: 'skip' });
  traces.push({ type: 'scattermap', mode: 'markers', lat: [], lon: [], marker: { size: 4, color: 'mediumvioletred' }, name: 'Mix', showlegend: true, hoverinfo: 'skip' });
  traces.push({ type: 'scattermap', mode: 'markers', lat: [], lon: [], marker: { size: 4, color: 'blue' }, name: 'Snow', showlegend: true, hoverinfo: 'skip' });

  staticData.traces.forEach(t => traces.push(t));

  traces.push(meta.t2_colorbar_trace);

  traces.push({ type: 'scattermap', mode: 'lines', lat: [], lon: [], line: { color: 'black', width: 1.5 }, name: 'Wind', showlegend: true, hoverinfo: 'skip' });

  traces.push({
    type: 'scattermap', mode: 'markers',
    lat: [], lon: [],
    marker: { size: 1, color: 'black', opacity: 0 },
    name: 't2 hovertext',
    showlegend: false,
    opacity: 0,
    customdata: [],
    hovertemplate:
      '2m Temp: %{customdata[0]:.0f}°F<br>' +
      '10m Wnd: %{customdata[1]:.0f} mph<br>' +
      'Elev: %{customdata[2]:.0f} ft' +
      '<extra></extra>',
  });

  const layout = {
    map: {
      style: 'white-bg',
      center: { lat: 40.5, lon: -106.0 },
      zoom: 8,
      layers: [
        {
          below: 'traces',
          sourcetype: 'raster',
          sourceattribution: 'USGS',
          source: [
            'https://basemap.nationalmap.gov/arcgis/rest/services/' +
            'USGSShadedReliefOnly/MapServer/tile/{z}/{y}/{x}'
          ],
        },
        {
          sourcetype: 'image',
          source: '',
          opacity: 0.75,
          below: 'traces',
          coordinates: [
            [meta.domain.lon_min, meta.domain.lat_max],
            [meta.domain.lon_max, meta.domain.lat_max],
            [meta.domain.lon_max, meta.domain.lat_min],
            [meta.domain.lon_min, meta.domain.lat_min],
          ],
        },
      ],
    },
    margin: { l: 0, r: 0, t: 0, b: 0 },
    height: window.innerHeight - 110,
  };

  try {
    await Plotly.newPlot('map', traces, layout, {
      responsive: true,
      scrollZoom: true,
      displayModeBar: true,
      displaylogo: false,
    });
  } catch(e) {
    console.error('Plotly.newPlot failed:', e);
    document.getElementById('timestamp').innerText = 'Error: Plotly failed to render';
    return;
  }

  await loadFrame(0);
  prefetchFrames();
}

document.getElementById('slider').addEventListener('input', e => {
  loadFrame(parseInt(e.target.value));
});

document.getElementById('playBtn').addEventListener('click', () => {
  playing = !playing;
  document.getElementById('playBtn').innerText = playing ? '⏸ Pause' : '▶ Play';
  if (playing) {
    playInterval = setInterval(async () => {
      const next = (currentFrame + 1) % TOTAL_FRAMES;
      await loadFrame(next);
    }, 1000);
  } else {
    clearInterval(playInterval);
  }
});

// Init the radar tab immediately since it's the default active tab
radarInitialized = true;
initFigure().catch(err => {
  console.error('Top-level initFigure error:', err);
  document.getElementById('timestamp').innerText = 'Error: ' + err.message;
});

</script>
</body>
</html>
