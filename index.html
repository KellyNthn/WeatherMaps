<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <script src="https://cdn.plot.ly/plotly-2.35.0.min.js"></script>
  <style>
    body { margin: 0; background: #111; font-family: sans-serif; color: white; }
    #controls { padding: 10px; display: flex; align-items: center; gap: 12px; }
    #slider { flex: 1; }
    #timestamp { min-width: 160px; font-size: 14px; }
    #map { height: calc(100vh - 60px); }
  </style>
</head>
<body>

<div id="controls">
  <button id="playBtn">▶ Play</button>
  <input id="slider" type="range" min="0" max="3" value="0" step="1">
  <span id="timestamp">Loading...</span>
</div>
<div id="map"></div>

<script>

// ── Constants ──
// Trace indices must match insertion order in initFigure():
//   0-7:   radar dBZ contours (8 levels)
//   8:     Rain scatter
//   9:     Mix scatter
//   10:    Snow scatter
//   11-24: static traces from static.json (13 traces)
//   25:    t2 colorbar (from meta.json)
//   26:    Wind arrows
//   27:    Hover (t2 + wind speed)
const TRACE = {
  DBZ:   { start: 0, count: 8 },
  RAIN:  8,
  MIX:   9,
  SNOW:  10,
  // 11-23: static traces (13 of them)
  // 24:    colorbar dummy trace
  WIND:  25,
  HOVER: 26,
};

const DBZ_COLORS = [
  'rgb(0,255,0)', 'rgb(0,200,0)', 'rgb(255,255,0)',
  'rgb(255,165,0)', 'rgb(255,0,0)', 'rgb(180,0,0)',
  'rgb(255,0,255)', 'rgb(180,0,180)'
];

let TOTAL_FRAMES = 145;   // updated from meta.json on load
const frameCache = {};
let currentFrame = 0;
let playing = false;
let playInterval = null;
let staticData = null;
let meta = null;


// ── fetchFrame: fetch and cache a single frame JSON ──
async function fetchFrame(i) {
  if (frameCache[i]) return frameCache[i];
  const resp = await fetch(`data/frame_${String(i).padStart(2, '0')}.json`);
  if (!resp.ok) throw new Error(`Frame ${i} not found (HTTP ${resp.status})`);
  frameCache[i] = await resp.json();
  return frameCache[i];
}


// ── prefetchFrames: fire off background fetches for all frames ──
function prefetchFrames() {
  for (let i = 1; i < TOTAL_FRAMES; i++) {
    fetchFrame(i).catch(err => console.warn(`Prefetch frame ${i}:`, err.message));
  }
}


// ── loadFrame: update all dynamic traces and image layer for frame i ──
async function loadFrame(i) {
  let f;
  try {
    f = await fetchFrame(i);
  } catch(err) {
    console.warn(`Skipping frame ${i}:`, err.message);
    return;
  }
  console.log('Frame', i, 'wind_lats length:', f.wind_lats?.length);
  console.log('Frame', i, 'wind_lons length:', f.wind_lons?.length);
  console.log('Sample wind point:', f.wind_lats?.[0], f.wind_lons?.[0]);

// Build parallel arrays for restyle
const traceIndices = [];
const restyleData = { lat: [], lon: [], customdata: [] };

// Radar
for (let r = 0; r < 8; r++) {
  traceIndices.push(r);
  restyleData.lat.push(f.radar[r]?.lats ?? []);
  restyleData.lon.push(f.radar[r]?.lons ?? []);
  restyleData.customdata.push(null);
}

// Precip
[[TRACE.RAIN, f.rain], [TRACE.MIX, f.mix], [TRACE.SNOW, f.snow]].forEach(([idx, d]) => {
  traceIndices.push(idx);
  restyleData.lat.push(d?.lats ?? []);
  restyleData.lon.push(d?.lons ?? []);
  restyleData.customdata.push(null);
});

// Wind
traceIndices.push(TRACE.WIND);
restyleData.lat.push(f.wind_lats ?? []);
restyleData.lon.push(f.wind_lons ?? []);
restyleData.customdata.push(null);

// Hover
traceIndices.push(TRACE.HOVER);
restyleData.lat.push(f.hover?.lats ?? []);
restyleData.lon.push(f.hover?.lons ?? []);
restyleData.customdata.push(
  (f.hover?.t2 ?? []).map((t, idx) => [t, f.hover.spd[idx], staticData.ter[idx]])
);

await Plotly.restyle('map', restyleData, traceIndices);

  // Swap T2 temperature image
  await Plotly.relayout('map', {
    'map.layers[1].source': `data:image/webp;base64,${f.t2_img}`,
    'map.layers[1].coordinates': [
      [f.bounds.lon_min, f.bounds.lat_max],
      [f.bounds.lon_max, f.bounds.lat_max],
      [f.bounds.lon_max, f.bounds.lat_min],
      [f.bounds.lon_min, f.bounds.lat_min],
    ],
  });

  document.getElementById('timestamp').innerText = f.timestamp;
  currentFrame = i;
  document.getElementById('slider').value = i;
}


// ── initFigure: build the Plotly figure with static base + empty dynamic traces ──
async function initFigure() {
  console.log('initFigure started');

  // Declare local refs, assign to outer scope variables
  try {
    const staticResp = await fetch('data/static.json');
    console.log('static.json status:', staticResp.status);
    staticData = await staticResp.json();   // assigns to outer staticData
    console.log('static.json parsed, traces:', staticData.traces?.length);
  } catch(e) {
    console.error('static.json failed:', e);
    document.getElementById('timestamp').innerText = 'Error loading static.json';
    return;
  }

  try {
    const metaResp = await fetch('data/meta.json');
    console.log('meta.json status:', metaResp.status);
    meta = await metaResp.json();           // assigns to outer meta
    console.log('meta.json parsed, frames:', meta.total_frames);
    TOTAL_FRAMES = meta.total_frames;
    document.getElementById('slider').max = TOTAL_FRAMES - 1;
  } catch(e) {
    console.error('meta.json failed:', e);
    document.getElementById('timestamp').innerText = 'Error loading meta.json';
    return;
  }

  const traces = [];

  // ── Dynamic placeholders: inserted first so indices are stable ──

  // Radar dBZ contours: indices 0-7
  const levels = [10, 20, 30, 40, 50, 60, 70, 80];
  levels.forEach((lvl, i) => {
    traces.push({
      type: 'scattermap', mode: 'lines',
      lat: [], lon: [],
      line: { color: DBZ_COLORS[i], width: 2 },
      name: `${lvl} dBZ`,
      hoverinfo: 'skip',
      showlegend: true,
    });
  });

  // Precip type scatters: indices 8, 9, 10
  traces.push({
    type: 'scattermap', mode: 'markers',
    lat: [], lon: [],
    marker: { size: 4, color: 'chartreuse' },
    name: 'Rain', showlegend: true, hoverinfo: 'skip',
  });
  traces.push({
    type: 'scattermap', mode: 'markers',
    lat: [], lon: [],
    marker: { size: 4, color: 'mediumvioletred' },
    name: 'Mix', showlegend: true, hoverinfo: 'skip',
  });
  traces.push({
    type: 'scattermap', mode: 'markers',
    lat: [], lon: [],
    marker: { size: 4, color: 'blue' },
    name: 'Snow', showlegend: true, hoverinfo: 'skip',
  });

  // ── Static traces from static.json: indices 11 to 11+N-1 ──
  staticData.traces.forEach(t => traces.push(t));

  // ── T2 colorbar dummy trace from meta.json ──
  traces.push(meta.t2_colorbar_trace);

  // ── Wind arrows placeholder ──
  traces.push({
    type: 'scattermap', mode: 'lines',
    lat: [], lon: [],
    line: { color: 'black', width: 1.5 },
    name: 'Wind', showlegend: true, hoverinfo: 'skip',
  });

  // ── Hover placeholder (invisible markers carrying t2 + wind speed) ──
  traces.push({
    type: 'scattermap', mode: 'markers',
    lat: [], lon: [],
    marker: { size: 1, color: 'black', opacity: 0 },
    name: 't2 hovertext',
    showlegend: false,
    opacity: 0,
    customdata: [],
    hovertemplate:
      '2m Temp: %{customdata[0]:.0f}°F<br>' +
      '10m Wnd: %{customdata[1]:.0f} mph<br>' +
      'Elev: %{customdata[2]:.0f} ft' +
      '<extra></extra>',
  });

  console.log('Total traces built:', traces.length);
  console.log('Expected TRACE.WIND:', TRACE.WIND, '  TRACE.HOVER:', TRACE.HOVER);
  console.log('Actual wind index:', traces.length - 2, '  hover index:', traces.length - 1);

  const layout = {
    map: {
      style: 'white-bg',
      center: { lat: 40.5, lon: -106.0 },
      zoom: 8,
      layers: [
        {
          below: 'traces',
          sourcetype: 'raster',
          sourceattribution: 'USGS',
          source: [
            'https://basemap.nationalmap.gov/arcgis/rest/services/' +
            'USGSShadedReliefOnly/MapServer/tile/{z}/{y}/{x}'
          ],
        },
        // T2 temperature image — source swapped each frame via relayout
        {
          sourcetype: 'image',
          source: '',
          opacity: 0.75,
          below: 'traces',
          coordinates: [
            [meta.domain.lon_min, meta.domain.lat_max],
            [meta.domain.lon_max, meta.domain.lat_max],
            [meta.domain.lon_max, meta.domain.lat_min],
            [meta.domain.lon_min, meta.domain.lat_min],
          ],
        },
      ],
    },
    margin: { l: 0, r: 0, t: 0, b: 0 },
    height: window.innerHeight - 60,
  };



  console.log('Calling Plotly.newPlot...');
  try {
    await Plotly.newPlot('map', traces, layout, {
      responsive: true,
      scrollZoom: true,
      displayModeBar: true,
      displaylogo: false,
    });
    console.log('Plotly.newPlot succeeded');
  } catch(e) {
    console.error('Plotly.newPlot failed:', e);
    document.getElementById('timestamp').innerText = 'Error: Plotly failed to render';
    return;
  }
 const mapDiv = document.getElementById('map');
 console.log('wind trace object:', mapDiv.data[TRACE.WIND]);

  console.log('Calling loadFrame(0)...');
  await loadFrame(0);
  console.log('loadFrame(0) complete');

  prefetchFrames();
}


// ── Event listeners ──
document.getElementById('slider').addEventListener('input', e => {
  loadFrame(parseInt(e.target.value));
});

document.getElementById('playBtn').addEventListener('click', () => {
  playing = !playing;
  document.getElementById('playBtn').innerText = playing ? '⏸ Pause' : '▶ Play';
  if (playing) {
    playInterval = setInterval(async () => {
      const next = (currentFrame + 1) % TOTAL_FRAMES;
      await loadFrame(next);
    }, 1000);
  } else {
    clearInterval(playInterval);
  }
});


// ── Entry point ──
initFigure().catch(err => {
  console.error('Top-level initFigure error:', err);
  document.getElementById('timestamp').innerText = 'Error: ' + err.message;
});

</script>
</body>
</html>
